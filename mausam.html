<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Girish Gaur - Weather App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #153677, #4e085f);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 20px;
            background: maroon;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-box {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 25px;
            font-size: 15px;
        }

        #searchBtn {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            color: #153677;
            cursor: pointer;
            font-size: 18px;
        }

        #searchBtn:hover {
            background: #ffcc00;
        }

        #searchBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .weather-body {
            display: none;
        }

        .weather-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }

        .description {
            font-size: 20px;
            text-transform: capitalize;
            margin-bottom: 25px;
        }

        .weather-details {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .detail i {
            font-size: 28px;
        }

        .detail span {
            font-size: 19px;
            font-weight: bold;
        }

        .detail p {
            margin: 3px 0 0;
            font-size: 13px;
        }

        .location-not-found,
        .error-message {
            display: none;
            margin-top: 15px;
        }

        .location-not-found img {
            width: 130px;
            max-width: 100%;
            margin-top: 10px;
        }

        .location-not-found h2 {
            font-size: 20px;
        }

        .message {
            margin: 15px 0;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1><i class="fa-solid fa-cloud-sun"></i> WEATHER APP</h1>

        <form class="search-box" id="weatherForm">
            <input type="text" class="input-box" id="cityInput" placeholder="Enter city name" aria-label="City name"
                autocomplete="off" required>

            <button type="submit" id="searchBtn" aria-label="Search weather">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <p id="loading" class="message" role="status" style="display:none;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Fetching weather information...
        </p>

        <div class="location-not-found" id="notFound">
            <h2>Sorry, location not found!</h2>
            <p>Please check the city name and try again.</p>
        </div>

        <div class="error-message" id="errorMessage" role="alert"></div>

        <section class="weather-body" id="weatherBody" aria-live="polite">

            <img src="" alt="Weather condition" class="weather-img" id="weatherImg">

            <div class="weather-box">
                <p class="temperature" id="temperature">--°C</p>
                <p class="description" id="description">Weather condition</p>
                <p id="cityCountry"></p>
                <p id="localTime"></p>
            </div>

            <div class="weather-details">

                <div class="detail">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <span id="humidity">--%</span>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="detail">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <span id="windSpeed">-- km/h</span>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>
        </section>

        <div class="footer">
            Weather information :GIRISH GAUR
        </div>

    </main>

    <script>
        // IMPORTANT: Replace this with your valid WeatherAPI key.
        const API_KEY = "b26786b527124ea98ef113944260605";

        const weatherForm = document.getElementById("weatherForm");
        const cityInput = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");

        const weatherBody = document.getElementById("weatherBody");
        const notFound = document.getElementById("notFound");
        const errorMessage = document.getElementById("errorMessage");
        const loading = document.getElementById("loading");

        const weatherImg = document.getElementById("weatherImg");
        const temperature = document.getElementById("temperature");
        const description = document.getElementById("description");
        const humidity = document.getElementById("humidity");
        const windSpeed = document.getElementById("windSpeed");
        const cityCountry = document.getElementById("cityCountry");
        const localTime = document.getElementById("localTime");

        async function getData(city) {
            city = city.trim();

            if (!city) {
                cityInput.focus();
                return;
            }

            if (API_KEY === "YOUR_WEATHERAPI_KEY") {
                errorMessage.textContent =
                    "Please add your WeatherAPI key in the API_KEY setting.";
                errorMessage.style.display = "block";
                weatherBody.style.display = "none";
                notFound.style.display = "none";
                return;
            }

            loading.style.display = "block";
            errorMessage.style.display = "none";
            notFound.style.display = "none";
            weatherBody.style.display = "none";
            searchBtn.disabled = true;

            try {
                const url =
                    "https://api.weatherapi.com/v1/current.json" +
                    "?key=" + encodeURIComponent(API_KEY) +
                    "&q=" + encodeURIComponent(city) +
                    "&aqi=yes";

                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    if (data.error && data.error.code === 1006) {
                        notFound.style.display = "block";
                    } else {
                        throw new Error(
                            data.error?.message ||
                            "Unable to retrieve weather information."
                        );
                    }
                    return;
                }

                // WeatherAPI uses current.temp_c, not main.temp.
                temperature.textContent =
                    Math.round(data.current.temp_c) + "°C";

                description.textContent =
                    data.current.condition.text;

                humidity.textContent =
                    data.current.humidity + "%";

                windSpeed.textContent =
                    data.current.wind_kph + " km/h";

                cityCountry.textContent =
                    data.location.name + ", " +
                    data.location.country;

                localTime.textContent =
                    "Local time: " + data.location.localtime;

                // Use the icon provided by WeatherAPI.
                let iconUrl = data.current.condition.icon;

                if (iconUrl.startsWith("//")) {
                    iconUrl = "https:" + iconUrl;
                }

                weatherImg.src = iconUrl;
                weatherImg.alt = data.current.condition.text;

                weatherBody.style.display = "block";

            } catch (error) {
                console.error("Weather App error:", error);

                errorMessage.textContent =
                    "Unable to fetch weather. Please check your " +
                    "internet connection and API key, then try again.";

                errorMessage.style.display = "block";

            } finally {
                loading.style.display = "none";
                searchBtn.disabled = false;
            }
        }

        // Submit by clicking the search button or pressing Enter.
        weatherForm.addEventListener("submit", function (event) {
            event.preventDefault();
            getData(cityInput.value);
        });
    </script>

</body>

</html>
