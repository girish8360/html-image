<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="WEATHER">
    <title>WEATHER APP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>
<style>
    body {
        background: linear-gradient(135deg, orange, yellow);
    }

    .container {
        max-width: 600px;
        margin-top: 50px;
    }

    .card {

        background: linear-gradient(135deg, #71b7e6, darkblue);
        color: #fff;
        margin: 100px auto 0;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        text-align: center;
        padding: 30px;
        font-family: 'Times New Roman
 font-size: 24px;
    }

    .search {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        width: 100%;
    }

    .search input {
        border: 0;
        outline: 0;
        background: #ebfffc;
        color: #71b7e6;
        width: 70%;
        padding: 10px 25px;
        border-radius: 10px;
        margin-right: 10px;
        font-size: 16px;
        flex: 1;

    }

    .search button {
        border: 0;
        outline: 0;
        background: #71b7e6;
        color: #fff;
        width: 60px;
        height: 40px;
        padding: 10px 25px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
    }

    .search button img {
        width: 20px;
        height: 20px;
    }

    .search button:active {
        transform: scale(0.98);
    }

    .weather {
        display: none;
        text-align: center;
        margin-top: 30px;
    }



    .weather-icon {
        width: 100px;

        margin-top: 30px;
        object-fit: contain;
    }

    .weather h1 {
        font-size: 50px;
        font-weight: bold;
    }

    .weather h2 {
        font-size: 45px;
        font-weight: bold;
        margin-top: -10px;
    }

    .details {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        margin-top: 50px;
    }

    .temp {
        font-size: 55px;
        margin: 10px 0;
        font-weight: bold;
    }

    .description {
        font-size: 20px;
        text-transform: capitalize;
    }

    .city {
        font-size: 30px;
        font-weight: bold;
    }

    .details {
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
        gap: 20px;
    }

    .details .col {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .weather-icon {
        font-size: 35px;
    }

    .details p {
        margin: 0;
        font-size: 14px;
        text-align: left;
    }

    .error {
        display: none;
        color: #ffdddd;
        background: rgba(255, 0, 0, 0.2);
        padding: 10px;
        margin-top: 20px;
        border-radius: 10px;
        text-align: center;
    }

    @media (max-width: 576px) {
        .details {
            flex-direction: column;
            align-items: center;
        }

        .temp {
            font-size: 45px;
        }
    }

    .col {
        display: flex;
        text-align: left;
        justify-content: center;
        align-items: center;
        font-size: 18px;

    }

    .col img {
        width: 40px;
        margin-right: 10px;
    }

    .humidity,
    .wind {
        font-size: 15px;
        margin-top: -8px;
    }

    /*   .weather {
        display: none;
    } */
</style>

<body>



    <body>
        <div class="container">

            <h1 class="text-center">WEATHER APP</h1>
            <div class="card">
                <div class="search">
                    <input type="text" class="form-control" placeholder="Enter city name" spellcheck="false"
                        autocomplete="off">
                    <button type="button" id="searchBtn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                </div>

                <!-- ERROR MESSAGE -->
                <div class="error" id="errorMessage">
                    City not found. Please enter a valid city name.
                </div>

                <!-- WEATHER -->
                <div class="weather">
                    <!-- Weather icon -->

                    <i class="fa-sharp fa-solid fa-droplet" class="weather-main-icon" id="weatherIcon"
                        alt="Weather Icon"></i>
                    <h3 class="city">--</h3>
                    <h3 class="temp">--°C</h3>
                    <p class="description">--</p>

                </div>


                <div class="details">

                    <!-- HUMIDITY -->
                    <div class="col">
                        <i class="fa-solid fa-droplet" id="weatherIcon" alt="Weather Icon"></i>

                        <!-- <i class="fa-thin fa-droplet-percent" class="weather-icon" id="weatherIcon" alt="Weather Icon"></i> -->


                        <div>
                            <p class="humidity">--%</p>
                            <small>HUMIDITY</small>

                        </div>
                    </div>

                    <!-- WIND -->

                    <div class="col">

                        <i class="fa-solid fa-wind weather-icon" id="weatherIcon" alt="Weather Icon"></i>


                        <div>

                            <p class="wind">-- Km/H</p>
                            <small>WIND SPEED</small>

                        </div>

                    </div>
                </div>
            </div>
        </div>
        </div>
        <script>

            /* ==========================================
               OPENWEATHERMAP API KEY
            ========================================== */

            const apiKey = "065cebf0392efd266714ad518e98e455";


            /* ==========================================
               HTML ELEMENTS
            ========================================== */

            const searchBox = document.querySelector(".search input");
            const searchBtn = document.querySelector("#searchBtn");

            const weatherBox = document.querySelector(".weather");
            const errorMessage = document.querySelector("#errorMessage");

            const weatherIcon = document.querySelector("#weatherIcon");


            /* ==========================================
               WEATHER FUNCTION
            ========================================== */

            async function checkWeather(city) {

                // Remove unnecessary spaces
                city = city.trim();

                // Check empty input
                if (city === "") {

                    errorMessage.innerHTML =
                        "Please enter a city name.";

                    errorMessage.style.display = "block";
                    weatherBox.style.display = "none";

                    return;
                }


                try {

                    /*
                     IMPORTANT:
                     The city is inserted into the URL here.
                     The API key is inserted using backticks.
                    */

                    const apiUrl =
                        `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${apiKey}`;


                    const response = await fetch(apiUrl);


                    /*
                     OpenWeatherMap returns an error such as
                     404 if the city does not exist.
                    */

                    if (!response.ok) {

                        throw new Error("City not found");

                    }


                    const data = await response.json();


                    console.log(data);


                    /* ==========================================
                       DISPLAY WEATHER DATA
                    ========================================== */

                    document.querySelector(".city").innerHTML =
                        data.name;


                    document.querySelector(".temp").innerHTML =
                        Math.round(data.main.temp) + "°C";


                    document.querySelector(".humidity").innerHTML =
                        data.main.humidity + "%";


                    document.querySelector(".wind").innerHTML =
                        (data.wind.speed * 3.6).toFixed(1) + " Km/H";


                    document.querySelector(".description").innerHTML =
                        data.weather[0].description;


                    /* ==========================================
                       WEATHER ICON
                    ========================================== */

                    const weatherCondition =
                        data.weather[0].main.toLowerCase();


                    if (weatherCondition === "clouds") {

                        weatherIcon.src = "image/cloud.png";

                    }

                    else if (weatherCondition === "clear") {

                        weatherIcon.src = "image/clear.png";

                    }

                    else if (weatherCondition === "rain") {

                        weatherIcon.src = "image/rain.png";

                    }

                    else if (weatherCondition === "drizzle") {

                        weatherIcon.src = "image/drizzlee.png";

                    }

                    else if (weatherCondition === "mist" ||
                        weatherCondition === "fog" ||
                        weatherCondition === "haze") {

                        weatherIcon.src = "image/mist.png";

                    }

                    else {

                        /*
                         Default OpenWeatherMap icon
                         */

                        weatherIcon.src =
                            `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

                    }


                    /* ==========================================
                       SHOW WEATHER
                    ========================================== */

                    weatherBox.style.display = "block";

                    errorMessage.style.display = "none";

                }


                catch (error) {

                    console.error(error);


                    weatherBox.style.display = "none";


                    errorMessage.innerHTML =
                        "City not found. Please enter a valid city name.";


                    errorMessage.style.display = "block";

                }

            }


            /* ==========================================
               SEARCH BUTTON
            ========================================== */

            searchBtn.addEventListener("click", function () {

                checkWeather(searchBox.value);

            });


            /* ==========================================
               PRESS ENTER TO SEARCH
            ========================================== */

            searchBox.addEventListener("keydown", function (event) {

                if (event.key === "Enter") {

                    checkWeather(searchBox.value);

                }

            });


            /* ==========================================
               DEFAULT CITY
            ========================================== */

            window.addEventListener("load", function () {

                checkWeather("Delhi");

            });

        </script>







    </body>

</html>
